[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myelomemory"
version = "0.1.0"
description = "AI pipeline for predicting epigenetic drug resistance memory states in multiple myeloma"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Abhignya", email = "abhignya.j@gmail.com"},
]
keywords = [
    "proteomics", "epigenetics", "multiple-myeloma", "drug-resistance",
    "machine-learning", "graph-neural-network", "variational-autoencoder",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.2.0",
    "torchdiffeq>=0.2.3",
    "torch-geometric>=2.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "wandb>=0.16.0"]

[project.scripts]
myelomemory = "main:main"

[tool.setuptools.packages.find]
include = ["myelomemory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
