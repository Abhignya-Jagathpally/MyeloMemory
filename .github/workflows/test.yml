name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torchdiffeq torch-geometric
          pip install -e ".[dev]"
          pip install pytest

      - name: Verify imports
        run: |
          python -c "from myelomemory.config import MyeloMemoryConfig; print('imports OK')"
          python -c "from myelomemory.models.vae import ProteomeToEpigenomeVAE; print('VAE OK')"
          python -c "from myelomemory.models.stability import MemoryStabilityScorer; print('Stability OK')"

      - name: Run unit tests
        run: pytest tests/ -v --tb=short -p no:cacheprovider -k "not integration"
